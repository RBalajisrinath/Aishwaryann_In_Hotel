server {
    server_name aishwaryaminn.cloud www.aishwaryaminn.cloud;
    client_max_body_size 100M;
    client_body_buffer_size 100M;

    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /socket.io/ {
        proxy_pass http://localhost:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_connect_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /uploads {
        alias /var/www/hotel/server/uploads;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /admin/ {
        alias /var/www/hotel/admin/dist/;
        index index.html;
        error_page 404 /admin/index.html;
    }

    location /admin {
        return 301 /admin/;
    }

    location / {
        root /var/www/hotel/client/dist;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/aishwaryaminn.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aishwaryaminn.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.aishwaryaminn.cloud) {
        return 301 https://$host$request_uri;
    }

    if ($host = aishwaryaminn.cloud) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name aishwaryaminn.cloud www.aishwaryaminn.cloud;
    return 404;
}
